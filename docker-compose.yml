version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ismpce_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/emissions.db
    volumes:
      - ./data:/data:ro
      - ./models:/models:ro
      - db_data:/app

volumes:
  db_data:
